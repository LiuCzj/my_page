<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<!--
  站点图标：终端提示符 >_  + 全光谱渐变。

  【为什么不用「锦」字了】
  用户反馈：用字的图标不好看，别家网页用的都是图形。字在 16px 下会糊成一团墨，
  而图形可以靠形状直接读出来。

  【为什么选 >_】
  首页有一张「终端卡」（components/TerminalCard.tsx），是这个站真实的签名元素 ——
  图标用它，等于把页面里已有的识别符号提到标签栏上，比另造一个抽象符号更「本站在说本站」。
  同时 >_ 是通用的「命令行 / 技术」语汇，缩到 16px 也是两笔干净的粗形状，不会糊。

  【为什么是彩色渐变，而不是单色】
  用户要「五彩斑斓」。但 16px 下塞多个不同颜色的小元素是没用的 —— 每个都不到 1px。
  唯一能读出「彩」的办法就是**多段渐变**：一道斜向的四段渐变（青→蓝→紫→粉），
  即使缩到 16px，色相也仍然沿对角线变化，读起来是「彩色」而不是「一块紫」。

  【这四个色值怎么定的】
  不跟站内的强调紫绑定：图标显示在浏览器标签栏里，跟页面配色并不挨着，
  所以直接用当下 AI 产品最通用的一组「青→蓝→紫→粉」，
  辨识度高、也不容易和别家撞色。以后想换，只改下面四个 stop 即可。

  【规格】SVG，viewBox 32×32，任意尺寸都清晰。引用处：app/layout.tsx 的 metadata.icons。
  终端笔画：折角 stroke-width 2.7 + 圆头圆角；下划线同宽，长度与折角底边对齐。
-->
  <defs>
    <linearGradient id="fav" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.35" stop-color="#3B82F6"/>
      <stop offset="0.7" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#fav)"/>
  <polyline points="10.2,10 16.8,16 10.2,22" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="18.6" y1="22" x2="24.2" y2="22" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/>
</svg>
